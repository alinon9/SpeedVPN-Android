name: SpeedVPN Exhaustive Speed Limit Sweep
# Post-merge acceptance trigger for PR #22; comment-only, no behavior or threshold changes.

on:
  push:
    branches: [main, master]
    paths:
      - 'scripts/e2e/speed-limit-sweep.sh'
      - 'scripts/e2e/local_speed_test_server.py'
      - 'scripts/e2e/patch_hev_tcp_buffers.py'
      - 'scripts/e2e/benchmark_local_speed_test_server.py'
      - 'setup.sh'
      - 'scripts/e2e/verify_metrics.py'
      - 'scripts/e2e/tests/**'
      - 'app/build.gradle.kts'
      - 'app/src/main/java/com/speedvpn/app/SpeedTestEngine.kt'
      - 'app/src/main/java/com/speedvpn/app/MainActivity.kt'
      - 'app/src/main/java/com/speedvpn/app/SpeedLimiter.kt'
      - 'app/src/main/java/com/speedvpn/app/Socks5Server.kt'
      - 'app/src/main/java/com/speedvpn/app/SpeedVpnService.kt'
      - 'app/src/main/java/com/speedvpn/app/SpeedVerificationEngine.kt'
      - 'app/src/main/java/com/speedvpn/app/SpeedVerificationPolicy.kt'
      - 'app/src/test/java/com/speedvpn/app/SpeedLimiterConversionTest.kt'
      - 'app/src/test/java/com/speedvpn/app/SpeedVerificationPolicyTest.kt'
      - 'app/src/test/java/com/speedvpn/app/SpeedTestEngineSamplingTest.kt'
      - 'app/src/debug/res/xml/network_security_config.xml'
      - '.github/workflows/speedvpn-speed-limit-sweep.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/e2e/speed-limit-sweep.sh'
      - 'scripts/e2e/local_speed_test_server.py'
      - 'scripts/e2e/patch_hev_tcp_buffers.py'
      - 'scripts/e2e/benchmark_local_speed_test_server.py'
      - 'setup.sh'
      - 'scripts/e2e/verify_metrics.py'
      - 'scripts/e2e/tests/**'
      - 'app/build.gradle.kts'
      - 'app/src/main/java/com/speedvpn/app/SpeedTestEngine.kt'
      - 'app/src/main/java/com/speedvpn/app/MainActivity.kt'
      - 'app/src/main/java/com/speedvpn/app/SpeedLimiter.kt'
      - 'app/src/main/java/com/speedvpn/app/Socks5Server.kt'
      - 'app/src/main/java/com/speedvpn/app/SpeedVpnService.kt'
      - 'app/src/main/java/com/speedvpn/app/SpeedVerificationEngine.kt'
      - 'app/src/main/java/com/speedvpn/app/SpeedVerificationPolicy.kt'
      - 'app/src/test/java/com/speedvpn/app/SpeedLimiterConversionTest.kt'
      - 'app/src/test/java/com/speedvpn/app/SpeedVerificationPolicyTest.kt'
      - 'app/src/test/java/com/speedvpn/app/SpeedTestEngineSamplingTest.kt'
      - 'app/src/debug/res/xml/network_security_config.xml'
      - '.github/workflows/speedvpn-speed-limit-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep unrelated PR/main runs from cancelling one another; newer commits on the same ref still supersede stale runs.
  group: speedvpn-speed-limit-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  speed-limit-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;30.0.16248370'

      - name: Prepare native tunnel
        run: |
          set -euo pipefail
          test -x ./gradlew
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/30.0.16248370" >> "$GITHUB_ENV"
          bash ./setup.sh
          test "$(git -C app/src/main/jni/hev-socks5-tunnel rev-parse HEAD)" = 'd9dca26c7ad0e494492244f0309e80ee583e739e'
          python3 scripts/e2e/patch_hev_tcp_buffers.py --check app/src/main/jni/hev-socks5-tunnel/third-part/lwip/src/ports/include/lwipopts.h

      - name: Validate E2E harness helpers
        run: |
          set -euo pipefail
          bash -n scripts/e2e/speed-limit-sweep.sh
          python3 -m py_compile scripts/e2e/preference_matches.py scripts/e2e/verify_metrics.py scripts/e2e/local_speed_test_server.py scripts/e2e/metric_result_status.py scripts/e2e/patch_hev_tcp_buffers.py scripts/e2e/benchmark_local_speed_test_server.py scripts/e2e/tests/test_hev_tcp_buffer_patch.py scripts/e2e/tests/test_local_speed_test_server.py scripts/e2e/tests/test_metric_result_status.py
          python3 -m unittest discover -s scripts/e2e/tests -v

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -PspeedTestBaseUrl=http://10.0.2.2:18765 --stacktrace --no-daemon

      - name: Fingerprint measured APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          COMMIT="$(git rev-parse HEAD)"
          HASH="$(sha256sum "$APK" | cut -d' ' -f1)"
          {
            echo "commit=$COMMIT"
            echo "apk_sha256=$HASH"
            echo "speed_test_base_url=http://10.0.2.2:18765"
          } | tee speedvpn-debug-apk-fingerprint.txt

      - name: Run Android JVM unit tests
        run: ./gradlew :app:testDebugUnitTest -PspeedTestBaseUrl=http://10.0.2.2:18765 --stacktrace --no-daemon

      - name: Install Android Emulator
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH" >> "$GITHUB_ENV"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install emulator 'system-images;android-29;google_apis;x86_64'
          test -x "$ANDROID_SDK_ROOT/emulator/emulator"

      - name: Enable KVM
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cpu-checker
          sudo kvm-ok
          sudo chmod 666 /dev/kvm
          emulator -accel-check

      - name: Configure controlled fixture TCP windows
        run: |
          set -euo pipefail
          # The measured runner default capped the requested 4 MiB receive
          # buffer at 2 MiB. Raise the Linux socket maxima before the fixture
          # binds/listens so SYN window scaling can negotiate the intended size.
          sudo sysctl -w net.core.rmem_max=16777216
          sudo sysctl -w net.core.wmem_max=16777216
          sudo sysctl -w net.ipv4.tcp_rmem='4096 131072 16777216'
          sudo sysctl -w net.ipv4.tcp_wmem='4096 131072 16777216'
          sysctl net.core.rmem_max net.core.wmem_max net.ipv4.tcp_rmem net.ipv4.tcp_wmem

      - name: Start deterministic local speed-test fixture
        run: |
          nohup python3 -u scripts/e2e/local_speed_test_server.py --host 0.0.0.0 --port 18765 < /dev/null > speed-test-server.log 2>&1 &
          echo "$!" > speed-test-server.pid
          python3 - <<'PY'
          import json
          import time
          from urllib.request import urlopen

          MIN_RECEIVE_BUFFER_BYTES = 4 * 1024 * 1024
          for attempt in range(40):
              try:
                  with urlopen("http://127.0.0.1:18765/healthz", timeout=1) as response:
                      payload = json.loads(response.read())
                      effective = int(payload.get("socket_receive_buffer_bytes", 0))
                      if response.status == 200 and payload.get("status") == "ok":
                          print(f"Fixture accepted-socket SO_RCVBUF={effective} bytes")
                          if effective < MIN_RECEIVE_BUFFER_BYTES:
                              raise SystemExit(
                                  f"Fixture TCP receive buffer is capped at {effective} bytes; "
                                  f"need >= {MIN_RECEIVE_BUFFER_BYTES}. Refusing invalid upload baseline."
                              )
                          print("Deterministic local speed-test fixture is healthy with sufficient TCP receive buffer.")
                          break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit("Local speed-test fixture did not become ready")
          PY

      - name: Benchmark local fixture throughput before emulator execution
        run: python3 scripts/e2e/benchmark_local_speed_test_server.py --base-url http://127.0.0.1:18765 --rounds 3 --streams 6 --bytes-per-stream 8000000 --min-mbps 211.2 --output fixture-throughput-benchmark.json

      - name: Upload fixture benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: speedvpn-fixture-benchmark-diagnostics
          path: |
            fixture-throughput-benchmark.json
            speed-test-server.log
          if-no-files-found: warn
          retention-days: 7

      - name: Run exhaustive speed-limit sweep
        id: sweep
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="${RUNNER_TEMP}/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n speedvpn-sweep -k 'system-images;android-29;google_apis;x86_64' --force
          adb kill-server >/dev/null 2>&1 || true
          adb start-server
          nohup emulator -avd speedvpn-sweep -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -no-metrics -gpu swiftshader_indirect -accel on -cores 4 -memory 4096 -partition-size 2048 -netdelay none -netspeed full -dns-server 8.8.8.8,1.1.1.1 > emulator-console.log 2>&1 &
          EMULATOR_PID=$!

          cleanup() {
            adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
            wait "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          diagnostics() {
            echo '===== SWEEP EMULATOR DIAGNOSTICS ====='
            adb devices -l || true
            adb -s emulator-5554 shell ip route || true
            adb -s emulator-5554 shell dumpsys connectivity | head -n 180 || true
            cat emulator-console.log || true
            echo '======================================='
          }
          trap cleanup EXIT

          for i in $(seq 1 180); do
            adb -s emulator-5554 get-state >/dev/null 2>&1 && break
            kill -0 "$EMULATOR_PID" >/dev/null 2>&1 || { diagnostics; exit 1; }
            sleep 1
          done
          adb -s emulator-5554 wait-for-device

          for i in $(seq 1 180); do
            adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$' && break
            kill -0 "$EMULATOR_PID" >/dev/null 2>&1 || { diagnostics; exit 1; }
            sleep 1
          done

          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
          echo "===== PACKAGE MANAGER HEALTH PRECHECK ====="
          package_ready=0
          for attempt in $(seq 1 30); do
            output="$(adb -s emulator-5554 shell cmd package list packages 2>&1)" && {
              echo "$output" | grep -q 'package:' && { echo "Package Manager healthy after attempt $attempt."; package_ready=1; break; }
            }
            echo "Package Manager unhealthy (attempt $attempt/30): $output"
            adb -s emulator-5554 logcat -d -v threadtime -t 1500 > "package-manager-attempt-$attempt-logcat.txt" 2>&1 || true
            sleep 2
          done
          if [ "$package_ready" -ne 1 ]; then
            echo "Package Manager health check failed; preserving diagnostics."
            adb -s emulator-5554 logcat -d -v threadtime > package-manager-fatal-logcat.txt 2>&1 || true
            cat emulator-console.log || true
            exit 1
          fi
          echo "===== APK INSTALL WITH DIAGNOSTIC RETRIES ====="
          installed=0
          for attempt in 1 2 3; do
            echo "Install attempt $attempt/3 at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            adb -s emulator-5554 logcat -c || true
            set +e
            adb -s emulator-5554 install -r app/build/outputs/apk/debug/app-debug.apk 2>&1 | tee "apk-install-attempt-$attempt.log"
            install_status=${PIPESTATUS[0]}
            set -e
            adb -s emulator-5554 logcat -d -v threadtime -t 5000 > "apk-install-attempt-$attempt-logcat.txt" 2>&1 || true
            if [ "$install_status" -eq 0 ]; then installed=1; break; fi
            adb -s emulator-5554 shell cmd package list packages > "apk-install-attempt-$attempt-packages.txt" 2>&1 || true
            adb -s emulator-5554 shell dumpsys meminfo > "apk-install-attempt-$attempt-meminfo.txt" 2>&1 || true
            [ "$attempt" -eq 3 ] || sleep 5
          done
          if [ "$installed" -ne 1 ]; then
            echo "APK install failed all three attempts; failure is not suppressed."
            adb -s emulator-5554 logcat -d -v threadtime > package-manager-fatal-logcat.txt 2>&1 || true
            cat emulator-console.log || true
            exit 1
          fi

          echo '===== ISOLATE EMULATOR BACKGROUND NETWORK NOISE ====='
          adb -s emulator-5554 shell settings put global private_dns_mode off
          adb -s emulator-5554 shell settings delete global private_dns_specifier || true
          adb -s emulator-5554 shell settings put global master_sync_enabled 0
          adb -s emulator-5554 shell settings put global wifi_scan_always_enabled 0
          adb -s emulator-5554 shell settings put global ble_scan_always_enabled 0
          echo "private_dns_mode=$(adb -s emulator-5554 shell settings get global private_dns_mode | tr -d '\r')"
          echo "master_sync_enabled=$(adb -s emulator-5554 shell settings get global master_sync_enabled | tr -d '\r')"

          echo '===== SWEEP NETWORK PRECHECK ====='
          adb -s emulator-5554 shell ip route || true
          adb -s emulator-5554 shell dumpsys connectivity | head -n 140 || true

          set +e
          bash scripts/e2e/speed-limit-sweep.sh
          SWEEP_RC=$?
          set -e
          case "$SWEEP_RC" in
            0)
              echo "sweep_status=PASS" >> "$GITHUB_OUTPUT"
              ;;
            75)
              echo "sweep_status=ENV_INSUFFICIENT" >> "$GITHUB_OUTPUT"
              echo "ACCEPTANCE_BLOCKED: ENV_INSUFFICIENT — no speed-limiter acceptance result is available because the runner did not establish required network headroom. This is an inconclusive run, not a pass; select a suitable runner/network and rerun the full 38/38 gate." | tee -a "$GITHUB_STEP_SUMMARY"
              # Do not let a skipped sweep be reported as a successful release check.
              exit 1
              ;;
            *)
              echo "SPEED_SWEEP_ERROR: speed-limit-sweep.sh exited with code ${SWEEP_RC}; only exit 0 plus a passing 38/38 validator is acceptable. Exit 75 means inconclusive network headroom and blocks release acceptance." | tee -a "$GITHUB_STEP_SUMMARY"
              exit "$SWEEP_RC"
              ;;
          esac

      - name: Strict 38/38 speed-limiter gate
        if: ${{ !cancelled() && steps.sweep.outputs.sweep_status != 'ENV_INSUFFICIENT' }}
        run: |
          set -euo pipefail
          test -s speed-limit-sweep/speed-limit-sweep-results.csv || { echo "Missing speed-limit-sweep/speed-limit-sweep-results.csv"; exit 1; }
          python3 scripts/e2e/verify_metrics.py validate-sweep speed-limit-sweep/speed-limit-sweep-results.csv

      - name: Upload exhaustive sweep results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: speedvpn-exhaustive-speed-limit-sweep
          path: |
            emulator-console.log
            package-manager-attempt-*-logcat.txt
            package-manager-fatal-logcat.txt
            apk-install-attempt-*.log
            apk-install-attempt-*-logcat.txt
            apk-install-attempt-*-packages.txt
            apk-install-attempt-*-meminfo.txt
            speed-test-server.log
            speedvpn-debug-apk-fingerprint.txt
            app/build/outputs/apk/debug/app-debug.apk
            fixture-throughput-benchmark.json
            speed-limit-sweep-results.csv
            speed-limit-sweep-summary.md
            speed-limit-sweep/**
          if-no-files-found: ignore

      - name: Stop deterministic local speed-test fixture
        if: always()
        run: |
          if [ -f speed-test-server.pid ]; then
            kill "$(cat speed-test-server.pid)" >/dev/null 2>&1 || true
          fi
