name: SpeedVPN Exhaustive Speed Limit Sweep

on:
  push:
    branches: [main, master]
    paths:
      - 'scripts/e2e/speed-limit-sweep.sh'
      - '.github/workflows/speedvpn-speed-limit-sweep.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/e2e/speed-limit-sweep.sh'
      - '.github/workflows/speedvpn-speed-limit-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep unrelated PR/main runs from cancelling one another; newer commits on the same ref still supersede stale runs.
  group: speedvpn-speed-limit-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  speed-limit-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;30.0.16248370'

      - name: Prepare native tunnel
        run: |
          set -euo pipefail
          test -x ./gradlew
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/30.0.16248370" >> "$GITHUB_ENV"
          bash ./setup.sh
          test "$(git -C app/src/main/jni/hev-socks5-tunnel rev-parse HEAD)" = 'd9dca26c7ad0e494492244f0309e80ee583e739e'

      - name: Validate E2E harness helpers
        run: |
          set -euo pipefail
          bash -n scripts/e2e/speed-limit-sweep.sh
          python3 -m py_compile scripts/e2e/preference_matches.py scripts/e2e/verify_metrics.py
          python3 -m unittest discover -s scripts/e2e/tests -v

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Run Android JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Install Android Emulator
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH" >> "$GITHUB_ENV"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install emulator 'system-images;android-29;google_apis;x86_64'
          test -x "$ANDROID_SDK_ROOT/emulator/emulator"

      - name: Enable KVM
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cpu-checker
          sudo kvm-ok
          sudo chmod 666 /dev/kvm
          emulator -accel-check

      - name: Run exhaustive speed-limit sweep
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="${RUNNER_TEMP}/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n speedvpn-sweep -k 'system-images;android-29;google_apis;x86_64' --force
          adb kill-server >/dev/null 2>&1 || true
          adb start-server
          nohup emulator -avd speedvpn-sweep -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -no-metrics -gpu swiftshader_indirect -accel on -cores 2 -memory 1536 -partition-size 2048 -netdelay none -netspeed full -dns-server 8.8.8.8,1.1.1.1 > emulator-console.log 2>&1 &
          EMULATOR_PID=$!

          cleanup() {
            adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
            wait "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          diagnostics() {
            echo '===== SWEEP EMULATOR DIAGNOSTICS ====='
            adb devices -l || true
            adb -s emulator-5554 shell ip route || true
            adb -s emulator-5554 shell dumpsys connectivity | head -n 180 || true
            cat emulator-console.log || true
            echo '======================================='
          }
          trap cleanup EXIT

          for i in $(seq 1 180); do
            adb -s emulator-5554 get-state >/dev/null 2>&1 && break
            kill -0 "$EMULATOR_PID" >/dev/null 2>&1 || { diagnostics; exit 1; }
            sleep 1
          done
          adb -s emulator-5554 wait-for-device

          for i in $(seq 1 180); do
            adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$' && break
            kill -0 "$EMULATOR_PID" >/dev/null 2>&1 || { diagnostics; exit 1; }
            sleep 1
          done

          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
          adb -s emulator-5554 install -r app/build/outputs/apk/debug/app-debug.apk

          echo '===== SWEEP NETWORK PRECHECK ====='
          adb -s emulator-5554 shell ip route || true
          adb -s emulator-5554 shell dumpsys connectivity | head -n 140 || true

          bash scripts/e2e/speed-limit-sweep.sh

      - name: Strict 38/38 speed-limiter gate
        if: always()
        run: |
          set -euo pipefail
          test -s speed-limit-sweep-results.csv || { echo "Missing speed-limit-sweep-results.csv"; exit 1; }
          python3 scripts/e2e/verify_metrics.py validate-sweep speed-limit-sweep-results.csv

      - name: Upload exhaustive sweep results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: speedvpn-exhaustive-speed-limit-sweep
          path: |
            emulator-console.log
            speed-limit-sweep-results.csv
            speed-limit-sweep-summary.md
            speed-limit-sweep/**
          if-no-files-found: ignore
