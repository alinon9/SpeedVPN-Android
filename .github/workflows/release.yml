name: Build Signed SpeedVPN Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;30.0.16248370'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Set NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Verify Gradle Wrapper
        run: |
          test -x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar.sha256
          ./gradlew --version

      - name: Fetch pinned native tunnel
        run: bash ./setup.sh

      - name: Verify native pin
        run: |
          test "$(git -C app/src/main/jni/hev-socks5-tunnel rev-parse HEAD)" = "d9dca26c7ad0e494492244f0309e80ee583e739e"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/speedvpn-release.jks"
          chmod 600 "$RUNNER_TEMP/speedvpn-release.jks"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/speedvpn-release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK signature and 16 KB ZIP alignment
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"

      - name: Verify 16 KB ELF PT_LOAD alignment
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          TMP="$(mktemp -d)"
          unzip -q "$APK" 'lib/*/*.so' -d "$TMP"
          READ_ELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          find "$TMP/lib" -name '*.so' -print0 | while IFS= read -r -d '' LIB; do
            echo "Checking $LIB"
            "$READ_ELF" -lW "$LIB" | awk '
              $1=="LOAD" { count++; if ($NF != "0x4000") bad=1 }
              END { if (count == 0 || bad) exit 1 }
            '
          done
          rm -rf "$TMP"


      - name: Create full source release archive
        run: |
          VERSION="v$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | cut -d'"' -f2)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ARCHIVE="SpeedVPN-${VERSION}-full-src.tar.gz"
          tar -czf "$RUNNER_TEMP/$ARCHIVE" --exclude='.git' --exclude='app/build' --exclude='.gradle' .
          test -s "$RUNNER_TEMP/$ARCHIVE"

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: SpeedVPN-${{ env.VERSION }}-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/SpeedVPN-${{ env.VERSION }}-full-src.tar.gz
          if-no-files-found: error

      - name: Cleanup keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/speedvpn-release.jks"
