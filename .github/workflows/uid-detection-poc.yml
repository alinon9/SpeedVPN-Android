name: UID Detection POC (Real Device APK)

on:
  push:
    branches:
      - poc/uid-detection-test
  pull_request:
    branches:
      - poc/uid-detection-test
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uid-detection-poc-real-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-poc-apk:
    name: Build diagnostic APK for a physical Android device
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated POC branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform, build tools and pinned NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          printf 'y\n%.0s' {1..100} | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Prepare pinned native tunnel and apply POC-only hook
        shell: bash
        run: |
          set -euo pipefail
          test -x ./gradlew
          bash ./setup.sh
          test "$(git -C app/src/main/jni/hev-socks5-tunnel rev-parse HEAD)" = 'd9dca26c7ad0e494492244f0309e80ee583e739e'
          bash -n setup.sh
          python3 -m py_compile scripts/poc/uid_detection/patch_hev_uid_detection_poc.py
          HEV_DIR="app/src/main/jni/hev-socks5-tunnel"
          JNI_C="$HEV_DIR/src/hev-jni.c"
          TUNNEL_C="$HEV_DIR/src/hev-socks5-tunnel.c"
          # Fail early if the POC patch did not inject the native cache and worker.
          grep -Fq 'UID_POC_FLOW_TABLE_SLOTS 8192u' "$JNI_C"
          grep -Fq 'UID_WORKER_READY stack=1048576' "$JNI_C"
          grep -Fq 'HIT_RATE=%.2f%%' "$JNI_C"
          grep -Fq 'uid_poc_find_slot_locked' "$JNI_C"
          grep -Fq 'if (uid_poc_report_packet (buf))' "$TUNNEL_C"
          grep -Fq 'pbuf_free (buf);' "$TUNNEL_C"
          grep -Fq 'PACKET_DROP uid=%d' "$JNI_C"
          grep -Fq 'packetBlocking=IMPLEMENTED' "$JNI_C"
          grep -Fq 'long onTunPacket(' app/src/main/java/hev/htproxy/TProxyService.java
          grep -Fq '): Long {' app/src/main/java/com/speedvpn/app/UidDetectionPoc.kt
          grep -Fq '"com.whatsapp.w4b"' app/src/main/java/com/speedvpn/app/UidDetectionPoc.kt
          grep -Fq '(I[BI[BI)J' "$JNI_C"
          if grep -Fq 'task_lwip_io = hev_task_new (131072);' "$TUNNEL_C"; then
            echo "::error::The HEV coroutine stack is still enlarged for JNI. JNI must only run on the dedicated worker."
            exit 1
          fi
          echo "Verified: native flow cache, dedicated UID worker, packed UID/action callback, and native packet DROP path are patched."

      - name: Build diagnostic APK
        id: build_poc
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Diagnose APK outputs
        if: always()
        shell: bash
        run: |
          echo "Build outcome: ${{ steps.build_poc.outcome }}"
          echo "APK files found:"
          find . -type f -name '*.apk' -print || true

      - name: Verify diagnostic APK
        id: verify_poc_apk
        if: steps.build_poc.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk"
          if [[ ! -d "$APK_DIR" ]]; then
            echo "::error::Gradle succeeded, but the APK output directory was not created: $APK_DIR"
            exit 1
          fi
          mapfile -d '' APK_FILES < <(find "$APK_DIR" -type f -name '*.apk' -print0)
          if ((${#APK_FILES[@]} == 0)); then
            echo "::error::Gradle succeeded, but no APK files were found under $APK_DIR"
            exit 1
          fi
          for apk in "${APK_FILES[@]}"; do
            if [[ ! -s "$apk" ]]; then
              echo "::error::APK exists but is empty: $apk"
              exit 1
            fi
            stat -c 'APK: %n | size: %s bytes' "$apk"
          done
          sha256sum "${APK_FILES[@]}" | tee apk-sha256.txt

      - name: Upload POC APK
        id: upload_poc
        uses: actions/upload-artifact@v4
        with:
          name: SpeedVPN-POC
          path: |
            app/build/outputs/apk/**/*.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14

      # Record exact run and artifact links in the tracked POC issue for later verification.
      - name: Publish run receipt to Issue #25
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          BUILD_OUTCOME: ${{ steps.build_poc.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_poc_apk.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_poc.outcome }}
          ARTIFACT_URL: ${{ steps.upload_poc.outputs.artifact-url }}
        with:
          script: |
            const runUrl = context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId;
            const body = [
              "### UID Detection POC CI receipt",
              "",
              "- Run: " + runUrl,
              "- Commit: " + context.sha,
              "- Build APK: " + (process.env.BUILD_OUTCOME || "not-run"),
              "- Verify APK: " + (process.env.VERIFY_OUTCOME || "not-run"),
              "- Upload artifact step: " + (process.env.UPLOAD_OUTCOME || "not-run"),
              "- Artifact: " + (process.env.ARTIFACT_URL || "unavailable; check build/verification/upload results"),
              "",
              "CI result only; this receipt does not assert that the native crash is fixed."
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 25,
              body
            });
