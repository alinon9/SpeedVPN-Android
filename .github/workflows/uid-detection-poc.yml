name: UID Detection POC (Real Device APK)

on:
  push:
    branches:
      - poc/uid-detection-test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uid-detection-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-poc-apk:
    name: Build diagnostic APK for a physical Android device
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated POC branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform, build tools and pinned NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Prepare pinned native tunnel and apply POC-only hook
        shell: bash
        run: |
          set -euo pipefail
          test -x ./gradlew
          bash ./setup.sh
          test "$(git -C app/src/main/jni/hev-socks5-tunnel rev-parse HEAD)" = 'd9dca26c7ad0e494492244f0309e80ee583e739e'
          bash -n setup.sh
          python3 -m py_compile scripts/poc/uid_detection/patch_hev_uid_detection_poc.py

      - name: Build diagnostic APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee apk-sha256.txt

      # Keep this immediately after the build so no test/device setup can block delivery.
      - name: Upload diagnostic APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpeedVPN-UID-Detection-POC
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: warn
          retention-days: 14
