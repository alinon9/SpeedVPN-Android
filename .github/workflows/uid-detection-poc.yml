name: UID Detection POC — Native Crash A/B (Physical Device APKs)

on:
  push:
    branches:
      - poc/uid-detection-test
      - poc/vpn-native-crash-diagnostic
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uid-detection-poc-crash-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-poc-ab-apks:
    name: Build no-hook and JNI-hook diagnostic APKs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated POC branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform, build tools and pinned NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Prepare pinned native tunnel and POC-only diagnostic patches
        shell: bash
        run: |
          set -euo pipefail
          test -x ./gradlew
          bash ./setup.sh
          test "$(git -C app/src/main/jni/hev-socks5-tunnel rev-parse HEAD)" = 'd9dca26c7ad0e494492244f0309e80ee583e739e'
          python3 scripts/poc/uid_detection/patch_hev_native_crash_handler.py app/src/main/jni/hev-socks5-tunnel
          bash -n setup.sh
          python3 -m py_compile scripts/poc/uid_detection/patch_hev_uid_detection_poc.py
          python3 -m py_compile scripts/poc/uid_detection/patch_hev_native_crash_handler.py

      - name: Build baseline APK (JNI packet callback disabled)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ./gradlew --no-daemon --stacktrace :app:assembleDebug -PuidPocJniHook=false
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" artifacts/uid-poc-no-jni-hook.apk
          sha256sum artifacts/uid-poc-no-jni-hook.apk | tee artifacts/uid-poc-no-jni-hook.sha256

      - name: Build comparison APK (JNI packet callback enabled)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug -PuidPocJniHook=true
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" artifacts/uid-poc-with-jni-hook.apk
          sha256sum artifacts/uid-poc-with-jni-hook.apk | tee artifacts/uid-poc-with-jni-hook.sha256

      - name: Upload both POC APKs and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpeedVPN-UID-POC-Crash-AB
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
