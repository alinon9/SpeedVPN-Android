name: SpeedVPN Full Android Emulator E2E v2

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: speedvpn-emulator-e2e-main
  cancel-in-progress: true

jobs:
  emulator-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;30.0.16248370'

      - name: Prepare native tunnel
        run: |
          set -euo pipefail
          test -x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar.sha256
          echo 'ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.16248370' >> "$GITHUB_ENV"
          echo 'ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/30.0.16248370' >> "$GITHUB_ENV"
          bash ./setup.sh
          test "$(git -C app/src/main/jni/hev-socks5-tunnel rev-parse HEAD)" = 'd9dca26c7ad0e494492244f0309e80ee583e739e'

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Install Android Emulator
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH" >> "$GITHUB_ENV"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install emulator 'system-images;android-29;google_apis;x86_64'
          test -x "$ANDROID_SDK_ROOT/emulator/emulator"

      - name: Enable KVM
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cpu-checker
          sudo kvm-ok
          sudo chmod 666 /dev/kvm
          emulator -accel-check

      - name: Run full Android E2E
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="${RUNNER_TEMP}/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n speedvpn-e2e -k 'system-images;android-29;google_apis;x86_64' --force
          adb kill-server >/dev/null 2>&1 || true
          adb start-server
          nohup emulator -avd speedvpn-e2e -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -no-metrics -gpu swiftshader_indirect -accel on -cores 2 -memory 1536 -partition-size 2048 -netdelay none -netspeed full -dns-server 8.8.8.8,1.1.1.1 > emulator-console.log 2>&1 &
          EMULATOR_PID=$!

          cleanup() {
            adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
            wait "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          diagnostics() {
            echo '===== EMULATOR DIAGNOSTICS ====='
            adb devices -l || true
            adb -s emulator-5554 shell ip route || true
            adb -s emulator-5554 shell getprop | grep -E 'net\.(dns|hostname)|dhcp' | head -n 100 || true
            adb -s emulator-5554 shell dumpsys connectivity | head -n 180 || true
            cat emulator-console.log || true
            echo '================================'
          }
          trap cleanup EXIT

          echo 'Waiting for emulator...'
          for i in $(seq 1 180); do
            adb -s emulator-5554 get-state >/dev/null 2>&1 && break
            kill -0 "$EMULATOR_PID" >/dev/null 2>&1 || { diagnostics; exit 1; }
            sleep 1
          done
          adb -s emulator-5554 wait-for-device
          for i in $(seq 1 180); do
            adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$' && break
            kill -0 "$EMULATOR_PID" >/dev/null 2>&1 || { diagnostics; exit 1; }
            sleep 1
          done

          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
          adb -s emulator-5554 install -r app/build/outputs/apk/debug/app-debug.apk

          dump_ui() {
            local out="$1"
            local remote=/sdcard/speedvpn-ui.xml
            for attempt in 1 2 3 4 5; do
              rm -f "$out"
              if adb -s emulator-5554 shell uiautomator dump "$remote" >/dev/null 2>&1 && adb -s emulator-5554 exec-out cat "$remote" > "$out" 2>/dev/null && [ -s "$out" ]; then
                adb -s emulator-5554 shell rm -f "$remote" >/dev/null 2>&1 || true
                return 0
              fi
              sleep 1
            done
            return 1
          }

          tap_text() {
            local wanted="$1"
            local xml="$RUNNER_TEMP/ui.xml"
            for scroll in 0 1 2 3 4 5; do
              dump_ui "$xml"
              if python3 - "$xml" "$wanted" <<'PY'
          import re, subprocess, sys, xml.etree.ElementTree as ET
          path, wanted = sys.argv[1], sys.argv[2]
          root = ET.parse(path).getroot()
          for node in root.iter('node'):
              if node.attrib.get('text','') == wanted:
                  m = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds',''))
                  if m:
                      x1,y1,x2,y2 = map(int,m.groups())
                      subprocess.run(['adb','-s','emulator-5554','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)],check=True)
                      raise SystemExit(0)
          raise SystemExit(1)
          PY
              then return 0; fi
              if [ "$scroll" -lt 5 ]; then
                adb -s emulator-5554 shell input swipe 160 500 160 220 600
                sleep 1
              fi
            done
            return 1
          }

          wait_for_result() {
            local title="$1"
            local loading="$2"
            local out="$3"
            for i in $(seq 1 300); do
              dump_ui "$out" || true
              if grep -q "$title" "$out" 2>/dev/null && ! grep -q "$loading" "$out" 2>/dev/null; then
                return 0
              fi

              # Async Compose content can move the completed card below the
              # small CI viewport. Periodically scroll while waiting so the
              # title/result can become observable instead of timing out.
              if [ "$((i % 5))" -eq 0 ]; then
                adb -s emulator-5554 shell input swipe 160 500 160 220 600 || true
              fi
              sleep 1
            done

            echo "Timed out waiting for $title."
            dump_ui "$out" || true
            adb -s emulator-5554 logcat -d -t 2500 > result-timeout-logcat.txt || true
            return 1
          }

          reveal_speed_metrics() {
            local out="$1"
            for reveal in 0 1 2 3 4 5 6 7; do
              dump_ui "$out" || true
              if grep -q 'Download' "$out" 2>/dev/null &&
                 grep -q 'Upload' "$out" 2>/dev/null; then
                echo "Speed result metrics are visible after scroll ${reveal}."
                return 0
              fi
              if [ "${reveal}" -lt 7 ]; then
                adb -s emulator-5554 shell input swipe 160 500 160 220 600
                sleep 1
              fi
            done
            echo "Could not expose Download/Upload metrics in the speed result."
            return 1
          }

          reveal_verify_metrics() {
            local out="$1"
            for reveal in 0 1 2 3 4 5 6 7 8; do
              dump_ui "$out" || true
              if grep -q '🌐 سرعة الإنترنت الأصلية' "$out" 2>/dev/null &&
                 grep -q '🔒 السرعة المحجوزة / المحددة' "$out" 2>/dev/null &&
                 grep -q '🚀 السرعة الفعلية داخل VPN' "$out" 2>/dev/null; then
                echo "Verify Speed metric rows are visible after scroll ${reveal}."
                return 0
              fi
              if [ "${reveal}" -lt 8 ]; then
                adb -s emulator-5554 shell input swipe 160 500 160 220 600
                sleep 1
              fi
            done
            echo "Could not expose complete Verify Speed metrics."
            return 1
          }

          echo '===== SMOKE TEST ====='
          adb -s emulator-5554 shell am force-stop com.speedvpn.app
          adb -s emulator-5554 shell am start -n com.speedvpn.app/.MainActivity
          sleep 5
          test -n "$(adb -s emulator-5554 shell pidof com.speedvpn.app | tr -d '\r' || true)"
          adb -s emulator-5554 logcat -d -t 1500 > smoke-logcat.txt
          ! grep -Eiq 'FATAL EXCEPTION|AndroidRuntime.*FATAL' smoke-logcat.txt

          echo '===== NETWORK + SPEED TEST ====='
          echo 'The SpeedVPN app HTTPS SpeedTest is the authoritative network check.'

          echo '===== SPEED TEST: 3 RUNS =====' | tee speed-results.txt
          adb -s emulator-5554 shell am force-stop com.speedvpn.app
          adb -s emulator-5554 shell am start -n com.speedvpn.app/.MainActivity
          sleep 4
          tap_text 'السرعة'
          for run in 1 2 3; do
            if [ "$run" -gt 1 ]; then
              echo 'Cooling down before repeat speed test...'
              sleep 3
            fi
            echo "RUN $run: start" | tee -a speed-results.txt
            tap_text '🚀 فحص السرعة'
            wait_for_result 'نتيجة فحص السرعة' 'جاري فحص السرعة…' "$RUNNER_TEMP/speed.xml"
            reveal_speed_metrics "$RUNNER_TEMP/speed.xml"
            ! grep -q 'فشل القياس' "$RUNNER_TEMP/speed.xml"
            python3 - "$RUNNER_TEMP/speed.xml" "$run" <<'PY' | tee -a speed-results.txt
          import re, sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          run = sys.argv[2]
          texts = [n.attrib.get('text','').strip() for n in root.iter('node') if n.attrib.get('text','').strip()]
          rate = re.compile(r'^\d+(?:\.\d+)? ?(?:bps|Kbps|Mbps|Gbps)$')
          for label in ('Download','Upload'):
              if label not in texts:
                  raise SystemExit(f'RUN {run}: missing {label}')
              idx = texts.index(label)
              value = next((x for x in texts[idx+1:idx+9] if rate.fullmatch(x)), None)
              if not value or float(re.match(r'^\d+(?:\.\d+)?', value).group()) <= 0:
                  raise SystemExit(f'RUN {run}: invalid {label}: {value}')
              print(f'RUN {run}: {label}={value}')
          PY
          done

          echo '===== SPEED LIMIT SWEEP: ALL LABELED PRESETS ====='
          # Exhaustively exercise every labeled speed preset through the real UI.
          # Each case selects Download + Upload, runs Verify Speed with the VPN,
          # records baseline/plan/VPN/verdict/reason, then shuts down the VPN.
          bash scripts/e2e/speed-limit-sweep.sh
          echo '===== ALL SPEEDVPN EMULATOR E2E TESTS PASSED ====='

      - name: Upload emulator logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: speedvpn-full-emulator-e2e-logs
          path: |
            emulator-console.log
            smoke-logcat.txt
            e2e-logcat.txt
            speed-results.txt
            verify-results.txt
            speed-limit-sweep-results.csv
            speed-limit-sweep-summary.md
            speed-limit-sweep/**
          if-no-files-found: ignore