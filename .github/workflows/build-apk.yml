name: Build SpeedVPN APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;30.0.16248370'


      - name: Set NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

      - name: Verify and bootstrap Gradle Wrapper
        run: |
          test -x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar.sha256
          ./gradlew --version

      - name: Fetch pinned native tunnel
        run: bash ./setup.sh

      - name: Verify native pin
        run: |
          test "$(git -C app/src/main/jni/hev-socks5-tunnel rev-parse HEAD)" = "d9dca26c7ad0e494492244f0309e80ee583e739e"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Run lint
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK for emulator
        uses: actions/upload-artifact@v7
        with:
          name: speedvpn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          trap 'rm -f "$RELEASE_KEYSTORE_PATH"' EXIT
          missing=()
          [ -n "${RELEASE_KEYSTORE_PASSWORD}" ] || missing+=("RELEASE_KEYSTORE_PASSWORD")
          [ -n "${RELEASE_KEY_ALIAS}" ] || missing+=("RELEASE_KEY_ALIAS")
          [ -n "${RELEASE_KEY_PASSWORD}" ] || missing+=("RELEASE_KEY_PASSWORD")
          [ -n "${RELEASE_KEYSTORE_BASE64}" ] || missing+=("RELEASE_KEYSTORE_BASE64")
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "All release signing inputs are present."
            printf "%s" "${RELEASE_KEYSTORE_BASE64}" | base64 -d > "$RELEASE_KEYSTORE_PATH"
            chmod 600 "$RELEASE_KEYSTORE_PATH"
            test -s "$RELEASE_KEYSTORE_PATH"
            ./gradlew :app:assembleRelease --stacktrace --no-daemon
          else
            echo "Release signing inputs missing: ${missing[*]}"
            echo "Building unsigned release for CI validation only."
            ./gradlew :app:assembleRelease --stacktrace --no-daemon
          fi

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"

          # Verify ZIP alignment suitable for 16 KB page-size devices.
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"

          # Verify expected native libraries are packaged for every supported ABI.
          TMP="$(mktemp -d)"
          unzip -q "$APK" 'lib/*/*.so' -d "$TMP"
          test -f "$TMP/lib/arm64-v8a/libhev-socks5-tunnel.so"
          test -f "$TMP/lib/armeabi-v7a/libhev-socks5-tunnel.so"
          test -f "$TMP/lib/x86_64/libhev-socks5-tunnel.so"

          # Verify every PT_LOAD segment is 16 KB aligned.
          READ_ELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$READ_ELF"
          find "$TMP/lib" -name '*.so' -print0 | while IFS= read -r -d '' LIB; do
            echo "Checking $LIB"
            "$READ_ELF" -lW "$LIB" | awk '
              $1=="LOAD" { count++; if ($NF != "0x4000") bad=1 }
              END { if (count == 0 || bad) exit 1 }
            '
          done
          rm -rf "$TMP"

      - name: Verify release APK
        run: |
          set -euo pipefail

          RELEASE_DIR="app/build/outputs/apk/release"
          echo "Release APK files:"
          find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.apk' -print

          mapfile -t RELEASE_APKS < <(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.apk' -print)

          if [ "${#RELEASE_APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one release APK, found ${#RELEASE_APKS[@]}"
            find "$RELEASE_DIR" -maxdepth 2 -type f -print
            exit 1
          fi

          APK="${RELEASE_APKS[0]}"
          echo "Verifying release APK: $APK"
          ls -lh "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          if [[ "$APK" != *-unsigned.apk ]]; then
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          else
            echo "Release APK is unsigned: $APK"
            echo "Signing secrets were not available to this workflow."
          fi

      - name: Upload APKs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: SpeedVPN-APKs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  emulator-smoke-test:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Android SDK tools
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH" >> "$GITHUB_ENV"
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

      - name: Install emulator SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"

          rm -rf "$ANDROID_SDK_ROOT/emulator"
          rm -rf "$ANDROID_SDK_ROOT/system-images/android-29/google_apis/x86_64"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          install_with_retry() {
            local package="$1"
            for attempt in 1 2 3; do
              echo "Installing $package (attempt $attempt/3)"
              if "$SDKMANAGER" --install "$package"; then
                return 0
              fi
              echo "Install failed; removing partial package and retrying..."
              if [[ "$package" == emulator ]]; then
                rm -rf "$ANDROID_SDK_ROOT/emulator"
              elif [[ "$package" == "system-images;"* ]]; then
                rm -rf "$ANDROID_SDK_ROOT/system-images/android-29/google_apis/x86_64"
              fi
              sleep 5
            done
            echo "Failed to install $package after 3 attempts."
            exit 1
          }

          install_with_retry "platform-tools"
          install_with_retry "emulator"
          install_with_retry "system-images;android-29;google_apis;x86_64"

          test -x "$ANDROID_SDK_ROOT/emulator/emulator"
          test -f "$ANDROID_SDK_ROOT/system-images/android-29/google_apis/x86_64/package.xml"
          test -f "$ANDROID_SDK_ROOT/system-images/android-29/google_apis/x86_64/system.img"

      - name: Enable KVM
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cpu-checker
          sudo kvm-ok
          echo "KVM device before permission fix:"
          ls -l /dev/kvm
          echo "Granting the GitHub runner user direct read/write access to KVM..."
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          echo "KVM device after permission fix:"
          ls -l /dev/kvm
          echo "Checking emulator acceleration as the runner user:"
          emulator -accel-check

      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: speedvpn-debug-apk
          path: app/build/outputs/apk/debug

      - name: Run Android Emulator smoke test + Build 197 speed test
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="${RUNNER_TEMP}/android-avd"
          mkdir -p "${ANDROID_AVD_HOME}"

          echo "Checking emulator system image..."
          test -f "${ANDROID_SDK_ROOT}/system-images/android-29/google_apis/x86_64/package.xml"
          test -f "${ANDROID_SDK_ROOT}/system-images/android-29/google_apis/x86_64/system.img"

          echo "Creating AVD..."
          timeout 120s bash -c 'echo no | avdmanager create avd -n speedvpn-ci -k "system-images;android-29;google_apis;x86_64" --force'
          test -f "${ANDROID_AVD_HOME}/speedvpn-ci.avd/config.ini"

          mkdir -p "$HOME/.android"
          chmod 700 "$HOME/.android"

          echo "Starting ADB server before the emulator..."
          adb kill-server >/dev/null 2>&1 || true
          adb start-server

          echo "Starting emulator..."
          nohup emulator -avd speedvpn-ci -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -no-metrics -gpu swiftshader_indirect -accel on -cores 2 -memory 1536 -partition-size 2048 > emulator-console.log 2>&1 &
          EMULATOR_PID=$!

          diagnostics() {
            echo "===== EMULATOR DIAGNOSTICS ====="
            echo "Runner:"
            uname -a || true
            echo "Memory:"
            free -h || true
            echo "Disk:"
            df -h "${RUNNER_TEMP}" "${ANDROID_SDK_ROOT}" || true
            echo "KVM:"
            ls -l /dev/kvm || true
            echo "Emulator process:"
            ps -fp "${EMULATOR_PID}" || true
            pgrep -af emulator || true
            echo "ADB devices:"
            adb devices -l || true
            echo "AVD config:"
            cat "${ANDROID_AVD_HOME}/speedvpn-ci.avd/config.ini" || true
            echo "Emulator console log:"
            cat emulator-console.log || true
            echo "Connectivity:"
            adb -s emulator-5554 shell dumpsys connectivity 2>/dev/null | head -n 120 || true
            echo "================================"
          }

          cleanup() {
            echo "Stopping Android Emulator..."
            adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
            kill "${EMULATOR_PID}" >/dev/null 2>&1 || true
            wait "${EMULATOR_PID}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo "Waiting for emulator device..."
          for i in $(seq 1 180); do
            if adb -s emulator-5554 get-state >/dev/null 2>&1; then
              echo "ADB device detected after ${i}s."
              break
            fi
            if ! kill -0 "${EMULATOR_PID}" >/dev/null 2>&1; then
              echo "Emulator process exited before appearing in ADB."
              diagnostics
              exit 1
            fi
            sleep 1
            if [ "${i}" -eq 180 ]; then
              echo "Emulator did not appear in ADB within 180 seconds."
              diagnostics
              exit 1
            fi
          done

          echo "Waiting for Android boot completion..."
          for i in $(seq 1 180); do
            if adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q "^1$"; then
              echo "Android boot completed after ${i}s."
              break
            fi
            if ! kill -0 "${EMULATOR_PID}" >/dev/null 2>&1; then
              echo "Emulator process exited during Android boot."
              diagnostics
              exit 1
            fi
            sleep 1
            if [ "${i}" -eq 180 ]; then
              echo "Android did not report boot completion within 180 seconds."
              diagnostics
              exit 1
            fi
          done

          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0

          echo "Installing debug APK..."
          adb -s emulator-5554 install -r app/build/outputs/apk/debug/app-debug.apk

          echo "Launching app for smoke test..."
          adb -s emulator-5554 shell am force-stop com.speedvpn.app
          adb -s emulator-5554 shell monkey -p com.speedvpn.app 1
          sleep 5

          test -n "$(adb -s emulator-5554 shell pidof com.speedvpn.app | tr -d '\r' || true)"
          adb -s emulator-5554 shell dumpsys activity activities | grep -m 1 "com.speedvpn.app"

          adb -s emulator-5554 logcat -d -t 500 > emulator-logcat.txt
          ! grep -Eiq "FATAL EXCEPTION|AndroidRuntime.*FATAL" emulator-logcat.txt
          echo "Android Emulator smoke test passed."

          dump_ui() {
            local output="$1"
            local remote="/sdcard/speedvpn-ui.xml"
            local dump_log="${RUNNER_TEMP}/speedvpn-ui-dump.log"

            for attempt in 1 2 3 4 5; do
              : > "${dump_log}"
              rm -f "${output}"

              if timeout 10s adb -s emulator-5554 shell uiautomator dump "${remote}" >"${dump_log}" 2>&1 &&
                 timeout 10s adb -s emulator-5554 exec-out cat "${remote}" >"${output}" 2>>"${dump_log}" &&
                 [ -s "${output}" ]; then
                adb -s emulator-5554 shell rm -f "${remote}" >/dev/null 2>&1 || true
                return 0
              fi

              echo "ADB UI dump/read failed (attempt ${attempt}/5):"
              cat "${dump_log}" || true

              if ! adb -s emulator-5554 get-state >/dev/null 2>&1; then
                echo "Emulator is not connected to ADB; attempting reconnect..."
                adb reconnect >/dev/null 2>&1 || true
                timeout 10s adb -s emulator-5554 wait-for-device >/dev/null 2>&1 || true
              fi
              sleep 1
            done

            echo "Could not read UI hierarchy from emulator."
            return 1
          }

          tap_text() {
            tap_text_occurrence "$1" 1
          }

          tap_text_occurrence() {
            local wanted="$1"
            local occurrence="$2"
            local xml="${RUNNER_TEMP}/ui-dump.xml"

            for scroll in 0 1 2 3 4; do
              dump_ui "${xml}"

              if python3 - "${xml}" "${wanted}" "${occurrence}" <<'PY'
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          path, wanted, occurrence = sys.argv[1], sys.argv[2], int(sys.argv[3])
          root = ET.parse(path).getroot()

          def wanted_match(text):
              if not text:
                  return False
              if wanted == "🚀":
                  return text == "🚀 فحص السرعة"
              return text == wanted

          matches = []
          for node in root.iter("node"):
              text = node.attrib.get("text", "")
              if wanted_match(text):
                  bounds = node.attrib.get("bounds", "")
                  match = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", bounds)
                  if match:
                      matches.append((text, tuple(map(int, match.groups()))))

          if len(matches) >= occurrence:
              text, (x1, y1, x2, y2) = matches[occurrence - 1]
              x = (x1 + x2) // 2
              y = (y1 + y2) // 2
              subprocess.run(
                  ["adb", "-s", "emulator-5554", "shell", "input", "tap", str(x), str(y)],
                  check=True,
              )
              print(f"TAPPED occurrence={occurrence} text={text!r} x={x} y={y}")
              raise SystemExit(0)

          raise SystemExit(2)
          PY
              then
                return 0
              fi

              if [ "${scroll}" -lt 4 ]; then
                echo "UI element '${wanted}' occurrence ${occurrence} is not visible yet; scrolling up (${scroll}/4)..."
                adb -s emulator-5554 shell input swipe 160 500 160 220 600
                sleep 1
              fi
            done

            echo "Could not find UI element '${wanted}' occurrence ${occurrence} after scrolling."
            cat "${xml}" || true
            return 1
          }

          wait_for_speed_result() {
            local out="$1"
            local loading_seen=0

            echo "Waiting for speed-test loading state..."
            for i in $(seq 1 20); do
              dump_ui "${out}.loading.xml" 2>/dev/null || true

              if grep -q "جاري فحص السرعة…" "${out}.loading.xml" 2>/dev/null; then
                echo "Loading state detected after ${i}s."
                loading_seen=1
                break
              fi

              if ! adb -s emulator-5554 get-state >/dev/null 2>&1; then
                echo "ADB device disappeared while waiting for speed-test loading state."
                diagnostics
                return 1
              fi
              sleep 1
            done

            if [ "${loading_seen}" -ne 1 ]; then
              echo "Speed-test loading state never appeared after tapping the button."
              adb -s emulator-5554 logcat -d -t 1500 > speed-test-logcat.txt || true
              return 1
            fi

            echo "Waiting for the current speed-test run to finish..."
            for i in $(seq 1 180); do
              if dump_ui "${out}" 2>/dev/null; then
                if grep -q "نتيجة فحص السرعة" "${out}" 2>/dev/null &&
                   ! grep -q "جاري فحص السرعة…" "${out}" 2>/dev/null; then
                  echo "Speed-test run completed after ${i}s."
                  return 0
                fi
              fi

              if ! adb -s emulator-5554 get-state >/dev/null 2>&1; then
                echo "ADB device disappeared during speed test."
                diagnostics
                return 1
              fi

              # Keep the result card reachable on the small CI viewport.
              # Some Compose layouts append the completed card below the
              # current scroll position after the async measurement finishes.
              if [ "$((i % 5))" -eq 0 ]; then
                adb -s emulator-5554 shell input swipe 160 500 160 220 600 || true
              fi
              sleep 1
            done

            echo "Speed test did not finish within 150 seconds."
            adb -s emulator-5554 logcat -d -t 2000 > speed-test-logcat.txt || true
            return 1
          }

          validate_speed_result() {
            local xml="$1"
            local run="$2"

            python3 - "${xml}" "${run}" <<'PY' | tee -a speed-test-results.txt
          import re
          import sys
          import xml.etree.ElementTree as ET

          path, run = sys.argv[1], sys.argv[2]
          root = ET.parse(path).getroot()
          texts = [
              node.attrib.get("text", "").strip()
              for node in root.iter("node")
              if node.attrib.get("text", "").strip()
          ]

          if "نتيجة فحص السرعة" not in texts:
              raise SystemExit(f"RUN {run}: missing speed-test result card")

          if "جاري فحص السرعة…" in texts:
              raise SystemExit(f"RUN {run}: speed test is still loading")

          if "فشل القياس" in texts:
              raise SystemExit(f"RUN {run}: speed test returned 'فشل القياس'")

          if any(text.startswith("ملاحظة:") for text in texts):
              notes = [text for text in texts if text.startswith("ملاحظة:")]
              raise SystemExit(f"RUN {run}: speed test reported an error/note: {notes}")

          rate_re = re.compile(r"^(?:\d+(?:\.\d+)?)[ ]?(?:bps|Kbps|Mbps|Gbps)$")

          def value_after(label):
              try:
                  idx = texts.index(label)
              except ValueError:
                  raise SystemExit(f"RUN {run}: missing {label} label")

              for candidate in texts[idx + 1:idx + 6]:
                  if candidate in {"Download", "Upload", "المدة", "ملاحظة:"}:
                      break
                  if rate_re.fullmatch(candidate):
                      number = float(re.match(r"\d+(?:\.\d+)?", candidate).group(0))
                      if number <= 0:
                          raise SystemExit(f"RUN {run}: {label} value is not positive: {candidate}")
                      return candidate
              raise SystemExit(f"RUN {run}: missing numeric {label} value after label")

          download = value_after("Download")
          upload = value_after("Upload")

          print(f"RUN {run}: Download={download}")
          print(f"RUN {run}: Upload={upload}")
          PY
          }

          echo "Checking Android connectivity state before network-dependent validation..."
          adb -s emulator-5554 shell dumpsys connectivity 2>/dev/null | head -n 180 || true
          adb -s emulator-5554 shell ip route 2>/dev/null || true
          echo "Network-dependent validation is blocking: the SpeedVPN HTTPS SpeedTest is the authoritative check."
          echo "Starting Build 197 speed test..."
          : > speed-test-results.txt

          for run in 1 2 3; do
            if [ "${run}" -gt 1 ]; then
              echo "Cooling down before repeat speed test..."
              sleep 3
            fi
            echo "===== SPEED TEST RUN ${run} =====" | tee -a speed-test-results.txt

            # Each run starts from a fresh Activity state so no previous
            # result card can be mistaken for the current run.
            adb -s emulator-5554 shell am force-stop com.speedvpn.app
            adb -s emulator-5554 shell am start -n com.speedvpn.app/.MainActivity
            sleep 4

            test -n "$(adb -s emulator-5554 shell pidof com.speedvpn.app | tr -d '\r' || true)"
            adb -s emulator-5554 shell dumpsys activity activities | grep -m 1 "com.speedvpn.app"

            tap_text "السرعة"
            sleep 2

            # The exact start label is used. The old generic matcher could
            # also tap "جاري فحص السرعة…" while the previous run was active.
            tap_text "🚀"

            ui_result="ui-result-${run}.xml"
            wait_for_speed_result "${ui_result}"

            # The result card may begin near the bottom of the 320x640
            # emulator viewport. Scroll upward to expose Download/Upload
            # values before parsing the hierarchy.
            for reveal in 0 1 2 3; do
              if validate_speed_result "${ui_result}" "${run}" 2>/dev/null; then
                break
              fi
              if [ "${reveal}" -eq 3 ]; then
                echo "Could not expose numeric Download/Upload values after scrolling."
                validate_speed_result "${ui_result}" "${run}"
                exit 1
              fi
              adb -s emulator-5554 shell input swipe 160 500 160 220 600
              sleep 1
              dump_ui "${ui_result}"
            done

            echo "RUN ${run}: numeric Download/Upload result validated." | tee -a speed-test-results.txt
          done

          echo "===== SPEED TEST COMPLETE =====" | tee -a speed-test-results.txt
          cat speed-test-results.txt

          adb -s emulator-5554 logcat -d -t 3000 > speed-test-logcat.txt
          if grep -Eiq "FATAL EXCEPTION|AndroidRuntime.*FATAL" speed-test-logcat.txt; then
            echo "Fatal exception detected during Build 197 speed test."
            exit 1
          fi

          echo "Starting Verify Speed end-to-end test..."

          # Use a finite, low plan so the policy has a real target to evaluate.
          # The first 100 KB preset belongs to Download; occurrence 2 belongs
          # to Upload after the page is scrolled far enough to expose it.
          adb -s emulator-5554 shell am force-stop com.speedvpn.app
          adb -s emulator-5554 shell am start -n com.speedvpn.app/.MainActivity
          sleep 4

          tap_text "السرعة"
          sleep 2

          # Set Download from the first visible 100 KB preset.
          tap_text "100 KB"
          sleep 1

          # Move to the Upload card so its 100 KB preset is the visible
          # matching element; do not rely on two identical labels being
          # visible at once on the 320x640 CI emulator.
          adb -s emulator-5554 shell input swipe 160 500 160 220 600
          sleep 1
          adb -s emulator-5554 shell input swipe 160 500 160 220 600
          sleep 1
          tap_text "100 KB"
          sleep 2

          verify_started=0

          # First tap may show the app's VPN disclosure and then Android's
          # system VPN confirmation. Complete both only when they appear.
          if tap_text "✅ تحقق من السرعة"; then
            sleep 1

            if tap_text "أوافق والمتابعة"; then
              echo "Accepted SpeedVPN VPN disclosure."
              sleep 2
              if tap_text "OK"; then
                echo "Accepted Android VPN confirmation."
              elif tap_text "السماح"; then
                echo "Accepted Android VPN permission."
              elif tap_text "Allow"; then
                echo "Accepted Android VPN permission."
              else
                echo "Android VPN confirmation dialog did not expose a known approval button."
                cat "${RUNNER_TEMP}/ui-dump.xml" || true
                exit 1
              fi
              sleep 3
              tap_text "✅ تحقق من السرعة"
            fi

            verify_started=1
          fi

          if [ "${verify_started}" -ne 1 ]; then
            echo "Could not start Verify Speed from the Speed screen."
            exit 1
          fi

          wait_for_verify_result() {
            local out="$1"
            local loading_seen=0

            echo "Waiting for Verify Speed loading state..."
            for i in $(seq 1 20); do
              dump_ui "${out}.loading.xml" 2>/dev/null || true

              if grep -q "جاري التحقق من الخطة…" "${out}.loading.xml" 2>/dev/null; then
                echo "Verify Speed loading state detected after ${i}s."
                loading_seen=1
                break
              fi

              if ! adb -s emulator-5554 get-state >/dev/null 2>&1; then
                echo "ADB device disappeared while waiting for Verify Speed."
                diagnostics
                return 1
              fi
              sleep 1
            done

            if [ "${loading_seen}" -ne 1 ]; then
              echo "Verify Speed loading state never appeared."
              return 1
            fi

            echo "Waiting for Verify Speed to finish..."
            for i in $(seq 1 300); do
              if dump_ui "${out}" 2>/dev/null; then
                if grep -q "نتيجة التحقق" "${out}" 2>/dev/null &&
                   ! grep -q "جاري التحقق من الخطة…" "${out}" 2>/dev/null; then
                  echo "Verify Speed finished after ${i}s."
                  return 0
                fi
              fi

              if ! adb -s emulator-5554 get-state >/dev/null 2>&1; then
                echo "ADB device disappeared during Verify Speed."
                diagnostics
                return 1
              fi
              sleep 1
            done

            echo "Verify Speed did not finish within 300 seconds."
            adb -s emulator-5554 logcat -d -t 4000 > verify-speed-logcat.txt || true
            return 1
          }

          validate_verify_result() {
            local xml="$1"

            python3 - "${xml}" <<'PY' | tee -a verify-speed-results.txt
          import re
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          root = ET.parse(path).getroot()
          texts = [
              node.attrib.get("text", "").strip()
              for node in root.iter("node")
              if node.attrib.get("text", "").strip()
          ]

          if "نتيجة التحقق" not in texts:
              raise SystemExit("VERIFY: missing result card")

          if "جاري التحقق من الخطة…" in texts:
              raise SystemExit("VERIFY: verification is still running")

          if "فشل القياس" in texts:
              raise SystemExit("VERIFY: one or more measurements failed")

          notes = [text for text in texts if text.startswith("ملاحظة:")]
          if notes:
              raise SystemExit(f"VERIFY: verification reported an error/note: {notes}")

          rate_re = re.compile(r"^(?:\d+(?:\.\d+)?)[ ]?(?:bps|Kbps|Mbps|Gbps)$")
          status_labels = {
              "✅ السرعة متطابقة",
              "❌ السرعة غير متطابقة",
              "⚠️ لا يمكن الحكم",
              "✅ لا يظهر سقف واضح",
          }

          for metric, next_metric in (("Download", "Upload"), ("Upload", None)):
              try:
                  start = texts.index(metric)
              except ValueError:
                  raise SystemExit(f"VERIFY: missing {metric} metric section")

              end = texts.index(next_metric, start + 1) if next_metric and next_metric in texts[start + 1:] else len(texts)
              section = texts[start:end]

              if not any(status in section for status in status_labels):
                  raise SystemExit(f"VERIFY: {metric} has no final verdict")

              def value_after(label):
                  try:
                      idx = section.index(label)
                  except ValueError:
                      raise SystemExit(f"VERIFY: {metric} missing label {label}")

                  for candidate in section[idx + 1:idx + 8]:
                      if candidate in {
                          "🌐 سرعة الإنترنت الأصلية",
                          "🔒 السرعة المحجوزة / المحددة",
                          "🚀 السرعة الفعلية داخل VPN",
                          "الدقة مقارنة بالخيار",
                      }:
                          continue
                      if candidate in status_labels:
                          break
                      if rate_re.fullmatch(candidate):
                          return candidate
                  raise SystemExit(f"VERIFY: {metric} missing numeric value after {label}")

              baseline = value_after("🌐 سرعة الإنترنت الأصلية")
              plan = value_after("🔒 السرعة المحجوزة / المحددة")
              vpn = value_after("🚀 السرعة الفعلية داخل VPN")

              if plan == "بدون حد":
                  raise SystemExit(f"VERIFY: {metric} plan is unexpectedly unlimited")

              print(f"VERIFY {metric}: baseline={baseline}, plan={plan}, vpn={vpn}")
              print(f"VERIFY {metric}: verdict={next(status for status in status_labels if status in section)}")
          PY
          }

          : > verify-speed-results.txt
          verify_result_xml="verify-speed-result.xml"

          wait_for_verify_result "${verify_result_xml}"

          # Bring the metric rows into the small emulator viewport before
          # parsing, in case only the result heading is currently visible.
          for reveal in 0 1 2 3 4; do
            if validate_verify_result "${verify_result_xml}" 2>/dev/null; then
              break
            fi
            if [ "${reveal}" -eq 4 ]; then
              echo "Could not expose complete Verify Speed metrics."
              validate_verify_result "${verify_result_xml}"
              exit 1
            fi
            adb -s emulator-5554 shell input swipe 160 500 160 220 600
            sleep 1
            dump_ui "${verify_result_xml}"
          done

          echo "===== VERIFY SPEED COMPLETE =====" | tee -a verify-speed-results.txt
          cat verify-speed-results.txt

          adb -s emulator-5554 logcat -d -t 5000 > verify-speed-logcat.txt
          if grep -Eiq "FATAL EXCEPTION|AndroidRuntime.*FATAL" verify-speed-logcat.txt; then
            echo "Fatal exception detected during Verify Speed."
            exit 1
          fi

          echo "Verify Speed end-to-end test passed on emulator."

          echo "Build 197 speed test passed on emulator."
      - name: Upload emulator logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-log
          path: |
            emulator-logcat.txt
            emulator-console.log
            speed-test-logcat.txt
            speed-test-results.txt
            ui-result-*.xml
            verify-speed-logcat.txt
            verify-speed-results.txt
            verify-speed-result.xml
            verify-speed-result.xml.loading.xml
          if-no-files-found: ignore
