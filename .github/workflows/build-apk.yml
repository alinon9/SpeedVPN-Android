name: Build SpeedVPN APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;30.0.16248370'


      - name: Set NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

      - name: Verify and bootstrap Gradle Wrapper
        run: |
          test -x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar.sha256
          ./gradlew --version

      - name: Fetch pinned native tunnel
        run: bash ./setup.sh

      - name: Verify native pin
        run: |
          test "$(git -C app/src/main/jni/hev-socks5-tunnel rev-parse HEAD)" = "d9dca26c7ad0e494492244f0309e80ee583e739e"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Run lint
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y cpu-checker
          sudo kvm-ok

      - name: Smoke test on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          script: |
            set -euo pipefail
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q 1
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.speedvpn.app
            adb shell monkey -p com.speedvpn.app 1
            sleep 5
            adb shell pidof com.speedvpn.app
            adb shell dumpsys activity activities | grep -m 1 "com.speedvpn.app"
            adb logcat -d -t 300 > emulator-logcat.txt
            ! grep -Eiq "FATAL EXCEPTION|AndroidRuntime.*FATAL" emulator-logcat.txt


      - name: Upload emulator log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-log
          path: emulator-logcat.txt
          if-no-files-found: ignore

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          trap 'rm -f "$RELEASE_KEYSTORE_PATH"' EXIT
          missing=()
          [ -n "${RELEASE_KEYSTORE_PASSWORD}" ] || missing+=("RELEASE_KEYSTORE_PASSWORD")
          [ -n "${RELEASE_KEY_ALIAS}" ] || missing+=("RELEASE_KEY_ALIAS")
          [ -n "${RELEASE_KEY_PASSWORD}" ] || missing+=("RELEASE_KEY_PASSWORD")
          [ -n "${RELEASE_KEYSTORE_BASE64}" ] || missing+=("RELEASE_KEYSTORE_BASE64")
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "All release signing inputs are present."
            printf "%s" "${RELEASE_KEYSTORE_BASE64}" | base64 -d > "$RELEASE_KEYSTORE_PATH"
            chmod 600 "$RELEASE_KEYSTORE_PATH"
            test -s "$RELEASE_KEYSTORE_PATH"
            ./gradlew :app:assembleRelease --stacktrace --no-daemon
          else
            echo "Release signing inputs missing: ${missing[*]}"
            echo "Building unsigned release for CI validation only."
            ./gradlew :app:assembleRelease --stacktrace --no-daemon
          fi

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"

          # Verify ZIP alignment suitable for 16 KB page-size devices.
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"

          # Verify expected native libraries are packaged for every supported ABI.
          TMP="$(mktemp -d)"
          unzip -q "$APK" 'lib/*/*.so' -d "$TMP"
          test -f "$TMP/lib/arm64-v8a/libhev-socks5-tunnel.so"
          test -f "$TMP/lib/armeabi-v7a/libhev-socks5-tunnel.so"
          test -f "$TMP/lib/x86_64/libhev-socks5-tunnel.so"

          # Verify every PT_LOAD segment is 16 KB aligned.
          READ_ELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$READ_ELF"
          find "$TMP/lib" -name '*.so' -print0 | while IFS= read -r -d '' LIB; do
            echo "Checking $LIB"
            "$READ_ELF" -lW "$LIB" | awk '
              $1=="LOAD" { count++; if ($NF != "0x4000") bad=1 }
              END { if (count == 0 || bad) exit 1 }
            '
          done
          rm -rf "$TMP"

      - name: Verify release APK
        run: |
          set -euo pipefail

          RELEASE_DIR="app/build/outputs/apk/release"
          echo "Release APK files:"
          find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.apk' -print

          mapfile -t RELEASE_APKS < <(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.apk' -print)

          if [ "${#RELEASE_APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one release APK, found ${#RELEASE_APKS[@]}"
            find "$RELEASE_DIR" -maxdepth 2 -type f -print
            exit 1
          fi

          APK="${RELEASE_APKS[0]}"
          echo "Verifying release APK: $APK"
          ls -lh "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          if [[ "$APK" != *-unsigned.apk ]]; then
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          else
            echo "Release APK is unsigned: $APK"
            echo "Signing secrets were not available to this workflow."
          fi

      - name: Upload APKs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: SpeedVPN-APKs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
