name: Build SpeedVPN APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;30.0.16248370'


      - name: Set NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

      - name: Verify and bootstrap Gradle Wrapper
        run: |
          test -x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar.sha256
          ./gradlew --version

      - name: Fetch pinned native tunnel
        run: bash ./setup.sh

      - name: Verify native pin
        run: |
          test "$(git -C app/src/main/jni/hev-socks5-tunnel rev-parse HEAD)" = "d9dca26c7ad0e494492244f0309e80ee583e739e"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Run lint
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK for emulator
        uses: actions/upload-artifact@v7
        with:
          name: speedvpn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          trap 'rm -f "$RELEASE_KEYSTORE_PATH"' EXIT
          missing=()
          [ -n "${RELEASE_KEYSTORE_PASSWORD}" ] || missing+=("RELEASE_KEYSTORE_PASSWORD")
          [ -n "${RELEASE_KEY_ALIAS}" ] || missing+=("RELEASE_KEY_ALIAS")
          [ -n "${RELEASE_KEY_PASSWORD}" ] || missing+=("RELEASE_KEY_PASSWORD")
          [ -n "${RELEASE_KEYSTORE_BASE64}" ] || missing+=("RELEASE_KEYSTORE_BASE64")
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "All release signing inputs are present."
            printf "%s" "${RELEASE_KEYSTORE_BASE64}" | base64 -d > "$RELEASE_KEYSTORE_PATH"
            chmod 600 "$RELEASE_KEYSTORE_PATH"
            test -s "$RELEASE_KEYSTORE_PATH"
            ./gradlew :app:assembleRelease --stacktrace --no-daemon
          else
            echo "Release signing inputs missing: ${missing[*]}"
            echo "Building unsigned release for CI validation only."
            ./gradlew :app:assembleRelease --stacktrace --no-daemon
          fi

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"

          # Verify ZIP alignment suitable for 16 KB page-size devices.
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"

          # Verify expected native libraries are packaged for every supported ABI.
          TMP="$(mktemp -d)"
          unzip -q "$APK" 'lib/*/*.so' -d "$TMP"
          test -f "$TMP/lib/arm64-v8a/libhev-socks5-tunnel.so"
          test -f "$TMP/lib/armeabi-v7a/libhev-socks5-tunnel.so"
          test -f "$TMP/lib/x86_64/libhev-socks5-tunnel.so"

          # Verify every PT_LOAD segment is 16 KB aligned.
          READ_ELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$READ_ELF"
          find "$TMP/lib" -name '*.so' -print0 | while IFS= read -r -d '' LIB; do
            echo "Checking $LIB"
            "$READ_ELF" -lW "$LIB" | awk '
              $1=="LOAD" { count++; if ($NF != "0x4000") bad=1 }
              END { if (count == 0 || bad) exit 1 }
            '
          done
          rm -rf "$TMP"

      - name: Verify release APK
        run: |
          set -euo pipefail

          RELEASE_DIR="app/build/outputs/apk/release"
          echo "Release APK files:"
          find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.apk' -print

          mapfile -t RELEASE_APKS < <(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.apk' -print)

          if [ "${#RELEASE_APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one release APK, found ${#RELEASE_APKS[@]}"
            find "$RELEASE_DIR" -maxdepth 2 -type f -print
            exit 1
          fi

          APK="${RELEASE_APKS[0]}"
          echo "Verifying release APK: $APK"
          ls -lh "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          if [[ "$APK" != *-unsigned.apk ]]; then
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          else
            echo "Release APK is unsigned: $APK"
            echo "Signing secrets were not available to this workflow."
          fi

      - name: Upload APKs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: SpeedVPN-APKs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  emulator-smoke-test:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Android SDK tools
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH" >> "$GITHUB_ENV"
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

      - name: Install emulator SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"

          rm -rf "$ANDROID_SDK_ROOT/emulator"
          rm -rf "$ANDROID_SDK_ROOT/system-images/android-29/google_apis/x86_64"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          install_with_retry() {
            local package="$1"
            for attempt in 1 2 3; do
              echo "Installing $package (attempt $attempt/3)"
              if "$SDKMANAGER" --install "$package"; then
                return 0
              fi
              echo "Install failed; removing partial package and retrying..."
              if [[ "$package" == emulator ]]; then
                rm -rf "$ANDROID_SDK_ROOT/emulator"
              elif [[ "$package" == "system-images;"* ]]; then
                rm -rf "$ANDROID_SDK_ROOT/system-images/android-29/google_apis/x86_64"
              fi
              sleep 5
            done
            echo "Failed to install $package after 3 attempts."
            exit 1
          }

          install_with_retry "platform-tools"
          install_with_retry "emulator"
          install_with_retry "system-images;android-29;google_apis;x86_64"

          test -x "$ANDROID_SDK_ROOT/emulator/emulator"
          test -f "$ANDROID_SDK_ROOT/system-images/android-29/google_apis/x86_64/package.xml"
          test -f "$ANDROID_SDK_ROOT/system-images/android-29/google_apis/x86_64/system.img"

      - name: Enable KVM
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cpu-checker
          sudo kvm-ok
          echo "KVM device before permission fix:"
          ls -l /dev/kvm
          echo "Granting the GitHub runner user direct read/write access to KVM..."
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          echo "KVM device after permission fix:"
          ls -l /dev/kvm
          echo "Checking emulator acceleration as the runner user:"
          emulator -accel-check

      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: speedvpn-debug-apk
          path: app/build/outputs/apk/debug

      - name: Run Android Emulator smoke test + Build 197 speed test
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="${RUNNER_TEMP}/android-avd"
          mkdir -p "${ANDROID_AVD_HOME}"

          echo "Checking emulator system image..."
          test -f "${ANDROID_SDK_ROOT}/system-images/android-29/google_apis/x86_64/package.xml"
          test -f "${ANDROID_SDK_ROOT}/system-images/android-29/google_apis/x86_64/system.img"

          echo "Creating AVD..."
          timeout 120s bash -c 'echo no | avdmanager create avd -n speedvpn-ci -k "system-images;android-29;google_apis;x86_64" --force'
          test -f "${ANDROID_AVD_HOME}/speedvpn-ci.avd/config.ini"

          mkdir -p "$HOME/.android"
          chmod 700 "$HOME/.android"

          echo "Starting ADB server before the emulator..."
          adb kill-server >/dev/null 2>&1 || true
          adb start-server

          echo "Starting emulator..."
          nohup emulator -avd speedvpn-ci -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -no-metrics -gpu swiftshader_indirect -accel on -cores 2 -memory 1536 -partition-size 2048 > emulator-console.log 2>&1 &
          EMULATOR_PID=$!

          diagnostics() {
            echo "===== EMULATOR DIAGNOSTICS ====="
            echo "Runner:"
            uname -a || true
            echo "Memory:"
            free -h || true
            echo "Disk:"
            df -h "${RUNNER_TEMP}" "${ANDROID_SDK_ROOT}" || true
            echo "KVM:"
            ls -l /dev/kvm || true
            echo "Emulator process:"
            ps -fp "${EMULATOR_PID}" || true
            pgrep -af emulator || true
            echo "ADB devices:"
            adb devices -l || true
            echo "AVD config:"
            cat "${ANDROID_AVD_HOME}/speedvpn-ci.avd/config.ini" || true
            echo "Emulator console log:"
            cat emulator-console.log || true
            echo "Connectivity:"
            adb -s emulator-5554 shell dumpsys connectivity 2>/dev/null | head -n 120 || true
            echo "================================"
          }

          cleanup() {
            echo "Stopping Android Emulator..."
            adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
            kill "${EMULATOR_PID}" >/dev/null 2>&1 || true
            wait "${EMULATOR_PID}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo "Waiting for emulator device..."
          for i in $(seq 1 180); do
            if adb -s emulator-5554 get-state >/dev/null 2>&1; then
              echo "ADB device detected after ${i}s."
              break
            fi
            if ! kill -0 "${EMULATOR_PID}" >/dev/null 2>&1; then
              echo "Emulator process exited before appearing in ADB."
              diagnostics
              exit 1
            fi
            sleep 1
            if [ "${i}" -eq 180 ]; then
              echo "Emulator did not appear in ADB within 180 seconds."
              diagnostics
              exit 1
            fi
          done

          echo "Waiting for Android boot completion..."
          for i in $(seq 1 180); do
            if adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "$r" | grep -q "^1$"; then
              echo "Android boot completed after ${i}s."
              break
            fi
            if ! kill -0 "${EMULATOR_PID}" >/dev/null 2>&1; then
              echo "Emulator process exited during Android boot."
              diagnostics
              exit 1
            fi
            sleep 1
            if [ "${i}" -eq 180 ]; then
              echo "Android did not report boot completion within 180 seconds."
              diagnostics
              exit 1
            fi
          done

          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0

          echo "Installing debug APK..."
          adb -s emulator-5554 install -r app/build/outputs/apk/debug/app-debug.apk

          echo "Launching app for smoke test..."
          adb -s emulator-5554 shell am force-stop com.speedvpn.app
          adb -s emulator-5554 shell monkey -p com.speedvpn.app 1
          sleep 5

          test -n "$(adb -s emulator-5554 shell pidof com.speedvpn.app | tr -d "$r" || true)"
          adb -s emulator-5554 shell dumpsys activity activities | grep -m 1 "com.speedvpn.app"

          adb -s emulator-5554 logcat -d -t 500 > emulator-logcat.txt
          ! grep -Eiq "FATAL EXCEPTION|AndroidRuntime.*FATAL" emulator-logcat.txt
          echo "Android Emulator smoke test passed."

          dump_ui() {
            local output="$1"
            local remote="/sdcard/speedvpn-ui.xml"
            local dump_log="${RUNNER_TEMP}/speedvpn-ui-dump.log"

            for attempt in 1 2 3 4 5; do
              : > "${dump_log}"
              rm -f "${output}"

              if timeout 10s adb -s emulator-5554 shell uiautomator dump "${remote}" >"${dump_log}" 2>&1 &&
                 timeout 10s adb -s emulator-5554 exec-out cat "${remote}" >"${output}" 2>>"${dump_log}" &&
                 [ -s "${output}" ]; then
                adb -s emulator-5554 shell rm -f "${remote}" >/dev/null 2>&1 || true
                return 0
              fi

              echo "ADB UI dump/read failed (attempt ${attempt}/5):"
              cat "${dump_log}" || true

              if ! adb -s emulator-5554 get-state >/dev/null 2>&1; then
                echo "Emulator is not connected to ADB; attempting reconnect..."
                adb reconnect >/dev/null 2>&1 || true
                timeout 10s adb -s emulator-5554 wait-for-device >/dev/null 2>&1 || true
              fi
              sleep 1
            done

            echo "Could not read UI hierarchy from emulator."
            return 1
          }

          tap_text() {
            local wanted="$1"
            local xml="${RUNNER_TEMP}/ui-dump.xml"

            dump_ui "${xml}"

            python3 - "${xml}" "${wanted}" <<'PY'
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          path, wanted = sys.argv[1], sys.argv[2]
          root = ET.parse(path).getroot()

          for node in root.iter("node"):
              text = node.attrib.get("text", "")
              if text == wanted or (wanted == "🚀" and text.startswith("🚀")):
                  bounds = node.attrib.get("bounds", "")
                  match = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", bounds)
                  if not match:
                      continue
                  x1, y1, x2, y2 = map(int, match.groups())
                  x = (x1 + x2) // 2
                  y = (y1 + y2) // 2
                  subprocess.run(
                      ["adb", "-s", "emulator-5554", "shell", "input", "tap", str(x), str(y)],
                      check=True,
                  )
                  print(f"TAPPED text={text!r} x={x} y={y}")
                  raise SystemExit(0)

          print(f"Could not find text {wanted!r}", file=sys.stderr)
          for node in root.iter("node"):
              text = node.attrib.get("text", "").strip()
              if text:
                  print(text, file=sys.stderr)
          raise SystemExit(1)
          PY
          }

          wait_for_result() {
            local out="$1"
            for i in $(seq 1 150); do
              if dump_ui "${out}" 2>/dev/null && grep -q "نتيجة فحص السرعة" "${out}" 2>/dev/null; then
                cat "${out}"
                return 0
              fi

              if ! adb -s emulator-5554 get-state >/dev/null 2>&1; then
                echo "ADB device disappeared during speed test."
                diagnostics
                return 1
              fi
              sleep 1
            done

            echo "Speed test did not finish within 150 seconds."
            adb -s emulator-5554 logcat -d -t 1500 > speed-test-logcat.txt || true
            return 1
          }

          echo "Starting Build 197 speed test..."
          adb -s emulator-5554 shell am force-stop com.speedvpn.app
          adb -s emulator-5554 shell am start -n com.speedvpn.app/.MainActivity
          sleep 4
          adb -s emulator-5554 shell dumpsys activity activities | grep -m 1 "com.speedvpn.app"

          : > speed-test-results.txt

          for run in 1 2 3; do
            echo "===== SPEED TEST RUN ${run} =====" | tee -a speed-test-results.txt

            if [ "${run}" -eq 1 ]; then
              tap_text "السرعة"
              sleep 2
            fi

            tap_text "🚀"
            sleep 2

            ui_result="ui-result-${run}.xml"
            wait_for_result "${ui_result}"

            python3 - "${ui_result}" <<'PY' | tee -a speed-test-results.txt
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          seen = set()
          for node in root.iter("node"):
              text = node.attrib.get("text", "").strip()
              if not text or text in seen:
                  continue
              seen.add(text)
              if any(k in text for k in ("نتيجة فحص السرعة", "Download", "Upload", "المدة", "ملاحظة:")):
                  print(text)
          PY

            if [ "${run}" -lt 3 ]; then
              sleep 2
            fi
          done

          echo "===== SPEED TEST COMPLETE =====" | tee -a speed-test-results.txt
          cat speed-test-results.txt

          adb -s emulator-5554 logcat -d -t 2000 > speed-test-logcat.txt
          if grep -Eiq "FATAL EXCEPTION|AndroidRuntime.*FATAL" speed-test-logcat.txt; then
            echo "Fatal exception detected during Build 197 speed test."
            exit 1
          fi

          echo "Build 197 speed test passed on emulator."

      - name: Upload emulator logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-log
          path: |
            emulator-logcat.txt
            emulator-console.log
          if-no-files-found: ignore
