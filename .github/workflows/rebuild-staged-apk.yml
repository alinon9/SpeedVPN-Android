name: Rebuild staged APK after AppTraffic fix

on:
  push:
    branches:
      - staging/quota-settlement-crash-safe-20261021
    paths:
      - app/src/main/java/com/speedvpn/app/AppTraffic.kt

permissions:
  contents: write
  actions: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging/quota-settlement-crash-safe-20261021
          fetch-depth: 0
      - name: Dispatch APK workflow and remove helper
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build-apk.yml --ref staging/quota-settlement-crash-safe-20261021 --repo "$GITHUB_REPOSITORY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/rebuild-staged-apk.yml
          git add -u .github/workflows/rebuild-staged-apk.yml
          git commit -m "Remove temporary staged APK dispatcher"
          git push origin "HEAD:staging/quota-settlement-crash-safe-20261021"
