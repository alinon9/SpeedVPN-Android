name: Measure Download Path

on:
  workflow_dispatch:
    inputs:
      measurement_timeout_seconds:
        description: Maximum time for the measurement runner
        required: true
        type: choice
        default: "600"
        options:
          - "300"
          - "600"
          - "900"

permissions:
  contents: read

concurrency:
  group: measure-download-path-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure-download-path:
    name: Build emulator and collect Download diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PACKAGE: com.speedvpn.app
      OUT_DIR: artifacts/download-path
      ANDROID_SERIAL: emulator-5554

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "emulator" \
            "ndk;30.0.16248370" \
            "system-images;android-29;google_apis;x86_64"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> "$GITHUB_ENV"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"

      - name: Validate diagnostic scripts
        run: |
          set -Eeuo pipefail
          bash -n scripts/e2e/measure_download_path.sh
          bash -n scripts/e2e/run-download-unlimited.sh
          test -s app/build.gradle.kts
          grep -Eq 'applicationId = "com\.speedvpn\.app"' app/build.gradle.kts
          echo "Verified actual applicationId=com.speedvpn.app from app/build.gradle.kts."
          git diff --exit-code -- app/src/main/java/com/speedvpn/app/SpeedTestEngine.kt
          git diff --exit-code -- app/src/main/java/com/speedvpn/app/Socks5Server.kt

      - name: Fetch pinned native tunnel
        run: bash ./setup.sh

      - name: Verify native pin
        run: |
          test "$(git -C app/src/main/jni/hev-socks5-tunnel rev-parse HEAD)" = "d9dca26c7ad0e494492244f0309e80ee583e739e"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Create and boot Android emulator
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts/download-path
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          emulator -accel-check || true
          echo "no" | "$AVDMANAGER" create avd \
            --name measure-download \
            --package "system-images;android-29;google_apis;x86_64" \
            --device pixel_2 \
            --force
          nohup emulator -avd measure-download \
            -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save \
            -no-metrics -gpu swiftshader_indirect -accel on \
            -cores 4 -memory 4096 -partition-size 2048 \
            -netdelay none -netspeed full -dns-server 8.8.8.8,1.1.1.1 \
            > artifacts/download-path/emulator-console.log 2>&1 &
          echo "$!" > artifacts/download-path/emulator.pid
          adb start-server
          ready=0
          for attempt in $(seq 1 180); do
            if adb -s emulator-5554 get-state >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat artifacts/download-path/emulator-console.log || true
            exit 1
          fi
          adb -s emulator-5554 wait-for-device
          booted=0
          for attempt in $(seq 1 180); do
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              booted=1
              break
            fi
            sleep 2
          done
          if [ "$booted" -ne 1 ]; then
            adb -s emulator-5554 logcat -d -v threadtime > artifacts/download-path/boot-failure-logcat.txt 2>&1 || true
            cat artifacts/download-path/emulator-console.log || true
            exit 1
          fi
          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
          adb -s emulator-5554 shell settings put global private_dns_mode off
          adb -s emulator-5554 shell settings delete global private_dns_specifier || true
          adb -s emulator-5554 shell settings put global master_sync_enabled 0
          adb -s emulator-5554 shell ip route > artifacts/download-path/routes-before.txt 2>&1 || true
          adb -s emulator-5554 shell dumpsys connectivity > artifacts/download-path/connectivity-booted.txt 2>&1 || true
          echo "Emulator booted and ready."

      - name: Run Download Unlimited diagnostic
        shell: bash
        env:
          MEASURE_TIMEOUT: ${{ inputs.measurement_timeout_seconds }}
        run: |
          set +e
          PACKAGE=com.speedvpn.app OUT_DIR=artifacts/download-path \
            bash scripts/e2e/measure_download_path.sh \
              --duration "$MEASURE_TIMEOUT" \
              --serial emulator-5554 \
              -- bash scripts/e2e/run-download-unlimited.sh
          result=$?
          echo "$result" > artifacts/download-path/workflow-exit-code.txt
          exit "$result"

      - name: Capture final emulator diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/download-path
          adb -s emulator-5554 logcat -d -v threadtime > artifacts/download-path/final-logcat.txt 2>&1 || true
          adb -s emulator-5554 shell dumpsys connectivity > artifacts/download-path/connectivity-final.txt 2>&1 || true
          adb -s emulator-5554 shell dumpsys cpuinfo > artifacts/download-path/cpuinfo-final.txt 2>&1 || true
          adb -s emulator-5554 shell cat /proc/net/tcp /proc/net/tcp6 > artifacts/download-path/proc-net-tcp-final.txt 2>&1 || true
          adb -s emulator-5554 shell 'command -v ss >/dev/null 2>&1 && ss -tinm || echo "ss unavailable or restricted"' > artifacts/download-path/ss-final.txt 2>&1 || true
          cat artifacts/download-path/emulator-console.log >> artifacts/download-path/emulator-console-final.log 2>/dev/null || true

      - name: Upload Download-path diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: download-path-diagnostics-${{ github.run_id }}
          path: artifacts/download-path/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          adb -s emulator-5554 emu kill >/dev/null 2>&1 || true
          if [ -s artifacts/download-path/emulator.pid ]; then
            kill "$(cat artifacts/download-path/emulator.pid)" >/dev/null 2>&1 || true
          fi
