name: SpeedVPN Emulator E2E

on:
  workflow_run:
    workflows: ["Build SpeedVPN APK"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  emulator-e2e:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure Android SDK
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH" >> "$GITHUB_ENV"

      - name: Install emulator packages
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install platform-tools emulator "system-images;android-29;google_apis;x86_64"

      - name: Enable KVM
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cpu-checker
          sudo kvm-ok
          sudo chmod 666 /dev/kvm
          emulator -accel-check

      - name: Download APK from Build workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p apk
          gh run download "${{ github.event.workflow_run.id }}" --repo "${{ github.repository }}" --name speedvpn-debug-apk --dir apk
          test -s apk/app-debug.apk
          ls -lh apk/app-debug.apk

      - name: Run Android Emulator tests
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="${RUNNER_TEMP}/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n speedvpn-e2e -k "system-images;android-29;google_apis;x86_64" --force
          adb kill-server >/dev/null 2>&1 || true
          adb start-server
          nohup emulator -avd speedvpn-e2e -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -no-metrics -gpu swiftshader_indirect -accel on -cores 2 -memory 1536 -partition-size 2048 -netdelay none -netspeed full -dns-server 8.8.8.8,1.1.1.1 > emulator-console.log 2>&1 &
          EMULATOR_PID=$!
          cleanup() { adb -s emulator-5554 emu kill >/dev/null 2>&1 || true; kill "$EMULATOR_PID" >/dev/null 2>&1 || true; wait "$EMULATOR_PID" >/dev/null 2>&1 || true; }
          diagnostics() { adb devices -l || true; adb -s emulator-5554 shell ip route || true; adb -s emulator-5554 shell getprop | grep -E "net\.(dns|hostname)|dhcp" | head -n 80 || true; adb -s emulator-5554 shell dumpsys connectivity | head -n 160 || true; cat emulator-console.log || true; }
          trap cleanup EXIT

          for i in $(seq 1 180); do
            adb -s emulator-5554 get-state >/dev/null 2>&1 && break
            kill -0 "$EMULATOR_PID" >/dev/null 2>&1 || { diagnostics; exit 1; }
            sleep 1
          done
          adb -s emulator-5554 wait-for-device
          for i in $(seq 1 180); do
            adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$' && break
            kill -0 "$EMULATOR_PID" >/dev/null 2>&1 || { diagnostics; exit 1; }
            sleep 1
          done
          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0

          adb -s emulator-5554 install -r apk/app-debug.apk
          adb -s emulator-5554 shell am force-stop com.speedvpn.app
          adb -s emulator-5554 shell am start -n com.speedvpn.app/.MainActivity
          sleep 5
          test -n "$(adb -s emulator-5554 shell pidof com.speedvpn.app | tr -d '\r' || true)"
          adb -s emulator-5554 logcat -d -t 1200 > smoke-logcat.txt
          ! grep -Eiq 'FATAL EXCEPTION|AndroidRuntime.*FATAL' smoke-logcat.txt

          echo "Testing HTTPS connectivity from the Android guest..."
          network_ok=0
          for i in 1 2 3 4 5; do
            if adb -s emulator-5554 shell toybox wget -q -O /dev/null -T 10 "https://speed.cloudflare.com/__down?bytes=1024" >/dev/null 2>&1; then network_ok=1; break; fi
            sleep 2
          done
          if [ "$network_ok" -ne 1 ]; then echo "No verified HTTPS Internet from Android guest"; diagnostics; exit 1; fi

          dump_ui() {
            local out="$1"
            local remote=/sdcard/speedvpn-ui.xml
            for a in 1 2 3 4 5; do
              rm -f "$out"
              if adb -s emulator-5554 shell uiautomator dump "$remote" >/dev/null 2>&1 && adb -s emulator-5554 exec-out cat "$remote" > "$out" 2>/dev/null && [ -s "$out" ]; then adb -s emulator-5554 shell rm -f "$remote" >/dev/null 2>&1 || true; return 0; fi
              sleep 1
            done
            return 1
          }

          tap_exact() {
            local wanted="$1"
            local xml="$RUNNER_TEMP/ui.xml"
            dump_ui "$xml"
            python3 - "$xml" "$wanted" <<'PY'
import re, subprocess, sys, xml.etree.ElementTree as ET
path, wanted = sys.argv[1], sys.argv[2]
root = ET.parse(path).getroot()
for n in root.iter('node'):
    if n.attrib.get('text','') == wanted:
        m = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.attrib.get('bounds',''))
        if m:
            x1,y1,x2,y2 = map(int,m.groups())
            subprocess.run(['adb','-s','emulator-5554','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)],check=True)
            raise SystemExit(0)
raise SystemExit(1)
PY
          }

          wait_result() {
            local title="$1"; local loading="$2"; local out="$3"
            for i in $(seq 1 300); do
              dump_ui "$out" || true
              if grep -q "$title" "$out" 2>/dev/null && ! grep -q "$loading" "$out" 2>/dev/null; then return 0; fi
              sleep 1
            done
            return 1
          }

          echo "===== SPEED TEST =====" | tee speed-results.txt
          adb -s emulator-5554 shell am force-stop com.speedvpn.app
          adb -s emulator-5554 shell am start -n com.speedvpn.app/.MainActivity
          sleep 4
          tap_exact "السرعة"
          for run in 1 2 3; do
            tap_exact "🚀 فحص السرعة"
            wait_result "نتيجة فحص السرعة" "جاري فحص السرعة…" "$RUNNER_TEMP/speed.xml"
            ! grep -q "فشل القياس" "$RUNNER_TEMP/speed.xml"
            python3 - "$RUNNER_TEMP/speed.xml" "$run" <<'PY' | tee -a speed-results.txt
import re,sys,xml.etree.ElementTree as ET
root=ET.parse(sys.argv[1]).getroot(); run=sys.argv[2]
t=[n.attrib.get('text','').strip() for n in root.iter('node') if n.attrib.get('text','').strip()]
r=re.compile(r'^\d+(?:\.\d+)? ?(?:bps|Kbps|Mbps|Gbps)$')
for label in ('Download','Upload'):
    if label not in t: raise SystemExit(f'RUN {run}: missing {label}')
    i=t.index(label); v=next((x for x in t[i+1:i+8] if r.fullmatch(x)),None)
    if not v or float(re.match(r'^\d+(?:\.\d+)?',v).group())<=0: raise SystemExit(f'RUN {run}: invalid {label}: {v}')
    print(f'RUN {run}: {label}={v}')
PY
          done

          echo "===== VERIFY SPEED =====" | tee verify-results.txt
          adb -s emulator-5554 shell am force-stop com.speedvpn.app
          adb -s emulator-5554 shell am start -n com.speedvpn.app/.MainActivity
          sleep 4
          tap_exact "السرعة"
          tap_exact "100 KB"
          adb -s emulator-5554 shell input swipe 160 500 160 220 600
          sleep 1
          adb -s emulator-5554 shell input swipe 160 500 160 220 600
          sleep 1
          tap_exact "100 KB"
          tap_exact "✅ تحقق من السرعة" || true
          sleep 2
          dump_ui "$RUNNER_TEMP/dialog.xml" || true
          if grep -q "أوافق والمتابعة" "$RUNNER_TEMP/dialog.xml" 2>/dev/null; then tap_exact "أوافق والمتابعة"; sleep 2; fi
          dump_ui "$RUNNER_TEMP/dialog2.xml" || true
          if grep -q "السماح" "$RUNNER_TEMP/dialog2.xml" 2>/dev/null; then tap_exact "السماح"; fi
          if grep -q "Allow" "$RUNNER_TEMP/dialog2.xml" 2>/dev/null; then tap_exact "Allow"; fi
          if grep -q "OK" "$RUNNER_TEMP/dialog2.xml" 2>/dev/null; then tap_exact "OK"; fi
          sleep 2
          dump_ui "$RUNNER_TEMP/verify-start.xml" || true
          if grep -q "✅ تحقق من السرعة" "$RUNNER_TEMP/verify-start.xml" 2>/dev/null; then tap_exact "✅ تحقق من السرعة"; fi
          wait_result "نتيجة التحقق" "جاري التحقق من الخطة…" "$RUNNER_TEMP/verify.xml"
          ! grep -q "فشل القياس" "$RUNNER_TEMP/verify.xml"
          grep -Eq "✅ السرعة متطابقة|❌ السرعة غير متطابقة|⚠️ لا يمكن الحكم|✅ لا يظهر سقف واضح" "$RUNNER_TEMP/verify.xml"
          grep -q "🌐 سرعة الإنترنت الأصلية" "$RUNNER_TEMP/verify.xml"
          grep -q "🔒 السرعة المحجوزة / المحددة" "$RUNNER_TEMP/verify.xml"
          grep -q "🚀 السرعة الفعلية داخل VPN" "$RUNNER_TEMP/verify.xml"
          echo "Verify Speed result card + baseline + plan + VPN + verdict validated." | tee -a verify-results.txt

          adb -s emulator-5554 logcat -d -t 5000 > e2e-logcat.txt
          ! grep -Eiq 'FATAL EXCEPTION|AndroidRuntime.*FATAL' e2e-logcat.txt
          echo "===== ALL E2E TESTS PASSED ====="

      - name: Upload emulator diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: speedvpn-emulator-e2e-logs
          path: |
            emulator-console.log
            smoke-logcat.txt
            e2e-logcat.txt
            speed-results.txt
            verify-results.txt
          if-no-files-found: ignore